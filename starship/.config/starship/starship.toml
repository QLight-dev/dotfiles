format = """
[](pink)\
$os\
$username\
[](bg:mauve fg:pink)\
$directory\
[](bg:lavender fg:mauve)\
$git_branch\
$git_status\
[](bg:blue fg:lavender)\
$rust\
[](bg:sapphire fg:blue)\
$cmd_duration\
[](fg:sapphire)\
$line_break\
$character"""

palette = 'catppuccin_mocha'

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[os]
disabled = false
style = "bg:pink fg:base"

[os.symbols]
Arch = "󰣇 "
Linux = "󰌽 "

[username]
show_always = true
style_user = "bg:pink fg:base"
style_root = "bg:pink fg:base"
format = '[$user ]($style)'

[directory]
style = "bg:mauve fg:base"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:lavender fg:base"
format = '[[ $symbol $branch ](fg:base bg:lavender)]($style)'

[git_status]
style = "bg:lavender fg:base"
format = '[[($all_status$ahead_behind )](fg:base bg:lavender)]($style)'

[rust]
symbol = ""
style = "bg:blue fg:base"
format = '[[ $symbol($version) ](fg:base bg:blue)]($style)'

[cmd_duration]
style = "bg:sapphire fg:base"
format = '[  $duration ]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold lavender)'
error_symbol = '[](bold red)'
vimcmd_symbol = '[](bold lavender)'
vimcmd_replace_one_symbol = '[](bold mauve)'
vimcmd_replace_symbol = '[](bold mauve)'
vimcmd_visual_symbol = '[](bold pink)'
